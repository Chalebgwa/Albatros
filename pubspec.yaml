name: albatros
description: A Flutter AR quiz application for landmark recognition with badges and missions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # AR Plugin
  ar_flutter_plugin: ^1.0.0
  
  # State Management
  provider: ^6.0.5
  
  # Image Recognition
  camera: ^0.10.5
  image: ^4.0.17
  tflite_flutter: ^0.10.4
  
  # Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Utilities
  uuid: ^4.0.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/landmarks/
    - assets/badges/
    - assets/models/
